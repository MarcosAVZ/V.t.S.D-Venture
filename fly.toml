# fly.toml — V.t.S.D-Venture
# Docs: https://fly.io/docs/reference/configuration/

app = 'vtsd-venture'
primary_region = 'gru'  # São Paulo — más cerca de Argentina

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
